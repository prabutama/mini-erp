syntax = "proto3";

package organization.v1;

option go_package = "github.com/isapr/mini-erp/proto/organization/v1;organizationv1";

service OrganizationService {
  rpc CreateBusiness(CreateBusinessRequest) returns (CreateBusinessResponse);
  rpc GetBusiness(GetBusinessRequest) returns (GetBusinessResponse);
  rpc UpdateBusiness(UpdateBusinessRequest) returns (UpdateBusinessResponse);
  rpc ListPlatformBusinesses(ListPlatformBusinessesRequest) returns (ListPlatformBusinessesResponse);
  rpc UpdatePlatformBusiness(UpdatePlatformBusinessRequest) returns (UpdateBusinessResponse);
  rpc CreateBranch(CreateBranchRequest) returns (CreateBranchResponse);
  rpc GetBranch(GetBranchRequest) returns (GetBranchResponse);
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);
  rpc ValidateBusiness(ValidateBusinessRequest) returns (ValidateBusinessResponse);
  rpc ValidateBranch(ValidateBranchRequest) returns (ValidateBranchResponse);
  rpc ValidateBranchAccess(ValidateBranchAccessRequest) returns (ValidateBranchAccessResponse);
  rpc ListAssignedBranches(ListAssignedBranchesRequest) returns (ListAssignedBranchesResponse);
  rpc CreateEmployeePlacement(CreateEmployeePlacementRequest) returns (CreateEmployeePlacementResponse);
  rpc ValidateEmployeePlacement(ValidateEmployeePlacementRequest) returns (ValidateEmployeePlacementResponse);
}

message CreateBusinessRequest {
  string name = 1;
  string timezone = 2;
}

message CreateBusinessResponse {
  string business_id = 1;
  string name = 2;
  string code = 3;
  string status = 4;
  string plan = 5;
  string platform_notes = 6;
  string suspended_at = 7;
  string timezone = 8;
  string created_at = 9;
  string updated_at = 10;
}

message GetBusinessRequest {
  string business_id = 1;
}

message GetBusinessResponse {
  string business_id = 1;
  string name = 2;
  string code = 3;
  string status = 4;
  string plan = 5;
  string platform_notes = 6;
  string suspended_at = 7;
  string timezone = 8;
  string created_at = 9;
  string updated_at = 10;
}

message UpdateBusinessRequest {
  string business_id = 1;
  string name = 2;
  string timezone = 3;
}

message UpdateBusinessResponse {
  string business_id = 1;
  string name = 2;
  string code = 3;
  string status = 4;
  string plan = 5;
  string platform_notes = 6;
  string suspended_at = 7;
  string timezone = 8;
  string created_at = 9;
  string updated_at = 10;
}

message ListPlatformBusinessesRequest {}

message ListPlatformBusinessesResponse {
  repeated GetBusinessResponse businesses = 1;
}

message UpdatePlatformBusinessRequest {
  string business_id = 1;
  string status = 2;
  string plan = 3;
  string platform_notes = 4;
  string suspended_at = 5;
}
message CreateBranchRequest {}
message CreateBranchResponse {}
message GetBranchRequest {}
message GetBranchResponse {}
message ListBranchesRequest {}
message ListBranchesResponse {}
message ValidateBusinessRequest {}
message ValidateBusinessResponse {}
message ValidateBranchRequest {}
message ValidateBranchResponse {}
message ValidateBranchAccessRequest {}
message ValidateBranchAccessResponse {}
message ListAssignedBranchesRequest {
  string user_id = 1;
  string business_id = 2;
}

message ListAssignedBranchesResponse {
  repeated string branch_ids = 1;
  repeated EmployeePlacement placements = 2;
}

message EmployeePlacement {
  string placement_id = 1;
  string user_id = 2;
  string business_id = 3;
  string branch_id = 4;
  string position = 5;
  string employment_type = 6;
  string status = 7;
}
message CreateEmployeePlacementRequest {}
message CreateEmployeePlacementResponse {}
message ValidateEmployeePlacementRequest {}
message ValidateEmployeePlacementResponse {}
