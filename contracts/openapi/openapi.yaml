openapi: 3.1.0
info:
  title: Mini ERP API
  version: 0.1.0
  description: Contract-first MVP skeleton for Mini ERP.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Platform
  - name: Businesses
  - name: Branches
  - name: Users
  - name: Roles
  - name: Services
  - name: Workflows
  - name: Service Orders
  - name: Resources
  - name: Reports
paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: Public tenant signup
      operationId: signupTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Tenant signed up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh token
      operationId: refreshToken
      responses:
        '200':
          description: Refreshed
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      operationId: logout
      responses:
        '204':
          description: Logged out
  /me:
    get:
      tags: [Auth]
      summary: Current authenticated user context
      operationId: getMe
      responses:
        '200':
          description: Current auth context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthContextResponse'
  /platform/businesses:
    get:
      tags: [Platform]
      summary: List platform-level tenant records
      operationId: listPlatformBusinesses
      responses:
        '200':
          description: Business list
  /platform/businesses/{business_id}:
    get:
      tags: [Platform]
      summary: Get platform-level tenant record
      operationId: getPlatformBusiness
      parameters:
        - $ref: '#/components/parameters/BusinessId'
      responses:
        '200':
          description: Business record
    patch:
      tags: [Platform]
      summary: Update platform-level tenant status metadata
      operationId: updatePlatformBusiness
      parameters:
        - $ref: '#/components/parameters/BusinessId'
      responses:
        '200':
          description: Updated
  /businesses/current:
    get:
      tags: [Businesses]
      summary: Get current business
      operationId: getCurrentBusiness
      responses:
        '200':
          description: Current business
    patch:
      tags: [Businesses]
      summary: Update current business
      operationId: updateCurrentBusiness
      responses:
        '200':
          description: Updated
  /branches:
    get:
      tags: [Branches]
      summary: List branches
      operationId: listBranches
      responses:
        '200':
          description: Branch list
    post:
      tags: [Branches]
      summary: Create branch
      operationId: createBranch
      responses:
        '201':
          description: Branch created
  /branches/{branch_id}:
    get:
      tags: [Branches]
      summary: Get branch
      operationId: getBranch
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Branch
    patch:
      tags: [Branches]
      summary: Update branch
      operationId: updateBranch
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Updated
  /users:
    get:
      tags: [Users]
      summary: List tenant users
      operationId: listUsers
      responses:
        '200':
          description: User list
    post:
      tags: [Users]
      summary: Create tenant user
      operationId: createUser
      responses:
        '201':
          description: User created
  /users/{user_id}:
    get:
      tags: [Users]
      summary: Get tenant user
      operationId: getUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User
    patch:
      tags: [Users]
      summary: Update tenant user
      operationId: updateUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User updated
  /users/{user_id}/roles:
    post:
      tags: [Users]
      summary: Assign fixed business role to user
      operationId: assignBusinessRole
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Role assigned
  /users/{user_id}/placements:
    post:
      tags: [Users]
      summary: Create employee placement for user
      operationId: createEmployeePlacement
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Placement created
  /roles:
    get:
      tags: [Roles]
      summary: List fixed MVP roles
      operationId: listRoles
      responses:
        '200':
          description: Fixed role catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRolesResponse'
  /workflows:
    get:
      tags: [Workflows]
      summary: List workflows
      operationId: listWorkflows
      responses:
        '200':
          description: Workflow list
    post:
      tags: [Workflows]
      summary: Create workflow
      operationId: createWorkflow
      responses:
        '201':
          description: Workflow created
  /workflows/{workflow_id}:
    get:
      tags: [Workflows]
      summary: Get workflow
      operationId: getWorkflow
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workflow
    patch:
      tags: [Workflows]
      summary: Update workflow
      operationId: updateWorkflow
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workflow updated
  /workflows/{workflow_id}/statuses:
    post:
      tags: [Workflows]
      summary: Add workflow status
      operationId: createWorkflowStatus
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Workflow status created
  /workflows/{workflow_id}/transitions:
    post:
      tags: [Workflows]
      summary: Add workflow transition
      operationId: createWorkflowTransition
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Workflow transition created
  /service-definitions:
    get:
      tags: [Services]
      summary: List service definitions
      operationId: listServiceDefinitions
      responses:
        '200':
          description: Service definition list
    post:
      tags: [Services]
      summary: Create service definition
      operationId: createServiceDefinition
      responses:
        '201':
          description: Service definition created
  /service-orders:
    get:
      tags: [Service Orders]
      summary: List service orders
      operationId: listServiceOrders
      parameters:
        - name: branch_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: assigned_user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service order list
    post:
      tags: [Service Orders]
      summary: Create service order
      operationId: createServiceOrder
      responses:
        '201':
          description: Service order created
  /service-orders/summary:
    get:
      tags: [Service Orders]
      summary: Service order status summary
      operationId: serviceOrderSummary
      parameters:
        - name: branch_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: assigned_user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service order status counts
  /service-orders/mine:
    get:
      tags: [Service Orders]
      summary: List service orders assigned to current user
      operationId: listMyServiceOrders
      parameters:
        - name: branch_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Assigned service order list
  /service-orders/{order_id}:
    get:
      tags: [Service Orders]
      summary: Get service order
      operationId: getServiceOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service order
  /service-orders/{order_id}/transition:
    post:
      tags: [Service Orders]
      summary: Transition service order status
      operationId: transitionServiceOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service order transitioned
        '409':
          description: Invalid status transition
  /service-orders/{order_id}/assign:
    post:
      tags: [Service Orders]
      summary: Assign service order
      operationId: assignServiceOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Service order assigned
        '403':
          description: Forbidden
        '409':
          description: Service order closed
  /service-orders/{order_id}/assignments:
    get:
      tags: [Service Orders]
      summary: List active service order assignments
      operationId: listServiceOrderAssignments
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Active assignments
  /resources:
    get:
      tags: [Resources]
      summary: List resources
      operationId: listResources
      parameters:
        - name: branch_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resource list
    post:
      tags: [Resources]
      summary: Create resource
      operationId: createResource
      responses:
        '201':
          description: Resource created
  /resources/{resource_id}/stock-movements:
    post:
      tags: [Resources]
      summary: Record stock movement
      operationId: recordStockMovement
      parameters:
        - name: resource_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Stock movement recorded
  /resources/{resource_id}/availability:
    get:
      tags: [Resources]
      summary: Get resource availability
      operationId: getResourceAvailability
      parameters:
        - name: resource_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resource availability
  /service-orders/{order_id}/resource-usage:
    get:
      tags: [Resources]
      summary: List resource usage for service order
      operationId: listResourceUsage
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resource usage list
    post:
      tags: [Resources]
      summary: Record resource usage for service order
      operationId: recordResourceUsage
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Resource usage recorded
  /reports/audit-events:
    get:
      tags: [Reports]
      summary: List reporting audit events
      operationId: listAuditEvents
      parameters:
        - name: branch_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audit event list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuditEventsResponse'
        '400':
          description: branch_id required for multi-branch managers
        '403':
          description: Forbidden
  /reports/operations-summary:
    get:
      tags: [Reports]
      summary: Get reporting operations summary snapshot
      operationId: getOperationsSummaryReport
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: branch_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Operations summary snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsSummaryReportResponse'
        '400':
          description: branch_id required for multi-branch managers
        '403':
          description: Forbidden
components:
  parameters:
    BusinessId:
      name: business_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BranchId:
      name: branch_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    SignupRequest:
      type: object
      required: [business_name, business_timezone, admin_full_name, admin_email, admin_password]
      properties:
        business_name:
          type: string
        business_timezone:
          type: string
        admin_full_name:
          type: string
        admin_email:
          type: string
          format: email
        admin_password:
          type: string
          format: password
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthSessionResponse:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/AuthContextResponse'
    AuthContextResponse:
      type: object
      required: [user_id, role, permissions, request_id]
      properties:
        user_id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [Platform Admin, Business Admin, Manager, Staff]
        permissions:
          type: array
          items:
            type: string
        assigned_branch_ids:
          type: array
          items:
            type: string
            format: uuid
        request_id:
          type: string
          format: uuid
    ListRolesResponse:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleResponse'
    RoleResponse:
      type: object
      required: [name, scope]
      properties:
        name:
          type: string
          enum: [Platform Admin, Business Admin, Manager, Staff]
        scope:
          type: string
          enum: [platform, business, branch]
    ListAuditEventsResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventResponse'
    AuditEventResponse:
      type: object
      required: [event_id, event_type, event_version, producer, business_id, occurred_at, data]
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
        event_version:
          type: integer
        producer:
          type: string
        business_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        request_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        data:
          type: string
    OperationsSummaryReportResponse:
      type: object
      required: [business_id, snapshot_date, open_orders, in_progress_orders, completed_orders, cancelled_orders, resources_used]
      properties:
        business_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        snapshot_date:
          type: string
          format: date
        open_orders:
          type: integer
        in_progress_orders:
          type: integer
        completed_orders:
          type: integer
        cancelled_orders:
          type: integer
        resources_used:
          type: number
