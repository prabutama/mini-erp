services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-erp-postgres
    environment:
      POSTGRES_USER: mini_erp
      POSTGRES_PASSWORD: mini_erp
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_erp -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
